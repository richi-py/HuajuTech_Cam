<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>{{ folder() }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding" style="--background: white; background: white;">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">{{ folder() }}</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Controles para expandir / reducir la cuadrícula -->
  <ion-card class="controls-card">
    <ion-card-content>
      <ion-item lines="none">
        <ion-range label="Filas ({{ rows }})" [(ngModel)]="rows" (ionChange)="generateGrid()" [min]="2" [max]="6" [step]="1" pin="true"></ion-range>
      </ion-item>
      <ion-item lines="none">
        <ion-range label="Columnas ({{ cols }})" [(ngModel)]="cols" (ionChange)="generateGrid()" [min]="2" [max]="6" [step]="1" pin="true"></ion-range>
      </ion-item>
    </ion-card-content>
  </ion-card>

  <!-- Cuadrícula interactiva de la zona de cultivo -->
  <div class="crop-grid" [style.--grid-cols]="cols">
    @for (cell of gridCells; track cell.id) {
      <div class="grid-cell" [class.has-device]="cell.hasDevice">
        <ion-icon [name]="'leaf-outline'"></ion-icon>
        <span class="cell-label">{{ cell.id }}</span>
      </div>
    }
  </div>

  <!-- Estado de LoRa y Dispositivos Conectados -->
  <ion-card class="status-card">
    <ion-card-header>
      <ion-card-title>Estado del Sistema</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list lines="none">
        <ion-item>
          <ion-icon name="radio-outline" slot="start" [color]="loraConnected ? 'success' : 'danger'"></ion-icon>
          <ion-label>
            <h3>Módulo LoRa (Ra-02)</h3>
            <p>{{ loraConnected ? 'Conectado • RSSI: -72 dBm' : 'Sin señal / Desconectado' }}</p>
          </ion-label>
        </ion-item>
        <ion-item>
          <ion-icon name="wifi-outline" slot="start" color="primary"></ion-icon>
          <ion-label>
            <h3>Nodos Activos</h3>
            <p>{{ connectedDevicesCount }} dispositivos vinculados</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <!-- Botón Flotante (FAB) para activar/desactivar la bomba de agua -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button [color]="isPumpActive ? 'danger' : 'success'" (click)="togglePump()">
      <ion-icon [name]="isPumpActive ? 'water' : 'water-outline'"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
