<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title class="ion-text-center">HuajuTech</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="login-container">
    
    <!-- Logo e Icono Principal -->
    <div class="logo-section">
      <img 
        src="assets/icon/1_CMYK_300dpi_30pct-removebg-preview.png"
        alt="Logo de la marca de HuajuTech"
      >
      <h2>{{ profileType === 'iniciarSesion' ? 'Bienvenido' : 'Crear una cuenta' }}</h2>
      <p>{{ profileType === 'iniciarSesion' ? 'Ingresa tus credenciales para continuar' : 'Regístrate para comenzar' }}</p>
    </div>

    <!-- Switch de Pestañas -->
    <div class="profile-segment-container">
      <div class="segmented-control">
        <button 
          class="segment-btn" 
          [class.active]="profileType === 'iniciarSesion'" 
          (click)="profileType = 'iniciarSesion'">
          Iniciar Sesión
        </button>
        <button 
          class="segment-btn" 
          [class.active]="profileType === 'crearCuenta'" 
          (click)="profileType = 'crearCuenta'">
          Crear Cuenta
        </button>
      </div>
    </div>

    <!-- Formulario -->
    <ion-card class="login-card">
      <ion-card-content>

        <!-- Campo adicional para Registro -->
        <ion-item lines="full" class="input-item" *ngIf="profileType === 'crearCuenta'">
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-input
            type="text"
            label="Nombre Completo"
            labelPlacement="floating"
            [(ngModel)]="strnombreUsuario"
            placeholder="Juan Pérez">
          </ion-input>
        </ion-item>
        
        <!-- Campo: Correo -->
        <ion-item lines="full" class="input-item">
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          <ion-input
            type="email"
            label="Correo Electrónico"
            labelPlacement="floating"
            [(ngModel)]="strcorreoUsuario"
            placeholder="correo@ejemplo.com">
          </ion-input>
        </ion-item>

        <!-- Campo: Contraseña -->
        <ion-item lines="full" class="input-item">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input
            type="password"
            label="Contraseña"
            labelPlacement="floating"
            [(ngModel)]="strcontrasena"
            placeholder="********">
          </ion-input>
        </ion-item>

        <!-- Botón de Acción Dinámico -->
        <ion-button 
          expand="block" 
          shape="round" 
          class="ion-margin-top login-btn" 
          (click)="procesarFormulario()">
          {{ profileType === 'iniciarSesion' ? 'Iniciar Sesión' : 'Registrarse' }}
        </ion-button>

      </ion-card-content>
    </ion-card>

  </div>
</ion-content>
