<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content>
        <ion-list id="inbox-list">
          <ion-list-header>Spectro Lora</ion-list-header>
          <ion-note>Salud de tus plantas en tiempo real</ion-note>

          @for (p of appPages; track p; let i = $index) {
            <ion-menu-toggle auto-hide="false">
              <ion-item routerDirection="root" [routerLink]="[p.url]" lines="none" detail="false" routerLinkActive="selected">
                <ion-icon aria-hidden="true" slot="start" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
                <ion-label>{{ p.title }}</ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
        </ion-list>

        <ion-list id="labels-list">
          <ion-list-header>Conexiones </ion-list-header>

          <ion-item lines="none">
            <ion-icon aria-hidden="true" slot="start" ios="wifi-outline" md="wifi-sharp"></ion-icon>
            <ion-label>
              <h3>Estado de Conexion LoRa</h3>
              <p>Estable</p>
            </ion-label>
          </ion-item>

          <ion-item lines="none">
            <ion-icon aria-hidden="true" slot="start" ios="hardware-chip-outline" md="hardware-chip-sharp"></ion-icon>
            <ion-label>
              <h3>Dispositivos Conectados</h3>
              <p>2 de 2 sensores conectados</p>
            </ion-label>
          </ion-item>
        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
